name: Ruby CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Ruby
        uses: actions/setup-ruby@v1
        with:
          ruby-version: 3.3.7

      - name: Install Dependencies
        run: bundle install

      - name: Run Rake tasks
        run: bundle exec rake
